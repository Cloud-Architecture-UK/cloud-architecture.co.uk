version: 2
updates:
  # npm packages (Astro, Tailwind, Preline, Expressive Code, and the rest)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # @astrojs/check peer-requires typescript "^5 || ^6"; a TS 7 major bump breaks
      # `npm install` (ERESOLVE). Hold major TS updates until @astrojs/check supports TS 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  # GitHub Actions — keeps the SHA-pinned actions current
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
