name: Deploy to Azure Static Web Apps

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [master]

# Least privilege: the deploy needs to read the repo and comment preview URLs
# on PRs, nothing more. Caps the blast radius of a compromised step/dependency.
permissions:
  contents: read
  pull-requests: write

jobs:
  build_and_deploy:
    # Skip Dependabot PRs: they run in a separate secret context without
    # CONTENT_REPO_TOKEN, so the submodule checkout can't authenticate. The
    # build is validated on merge to master instead.
    if: (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')) && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    name: Build and Deploy
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true
          # PAT with read access to the private content submodule
          # (Cloud-Architecture-UK/content-cloud-architecture).
          token: ${{ secrets.CONTENT_REPO_TOKEN }}
      - name: Build And Deploy
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: "/"
          api_location: "api"
          output_location: "dist"

  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    name: Close Pull Request
    steps:
      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
